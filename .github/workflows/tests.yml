name: Python Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -e .
          ./venv/bin/pip install pytest pytest-asyncio pytest-cov loguru

      - name: Run tests with coverage
        run: |
          ./venv/bin/python -m pytest --cov=python_utils tests/ --cov-report=term-missing --cov-fail-under=100
